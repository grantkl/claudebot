services:
  auth-proxy:
    image: nginx:alpine
    env_file: .env
    volumes:
      - ./proxy/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    restart: unless-stopped

  memory:
    build:
      context: https://github.com/doobidoo/mcp-memory-service.git
      dockerfile: tools/docker/Dockerfile
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/docker-entrypoint-unified.sh"]
    environment:
      - MCP_MODE=streamable-http
      - MCP_SSE_HOST=0.0.0.0
      - MCP_SSE_PORT=8765
      - MCP_MEMORY_STORAGE_BACKEND=sqlite_vec
      - MCP_MEMORY_SQLITE_PATH=/data/memories.db
      - MCP_ALLOW_ANONYMOUS_ACCESS=true
    volumes:
      - ./data/memory:/data:rw
    expose:
      - "8765"

  claudebot:
    build: .
    env_file: .env
    restart: unless-stopped
    depends_on:
      - auth-proxy
      - memory
    ports:
      - "${WEBHOOK_PORT:-8081}:8081"
    volumes:
      - ~/.homekit_pairings.json:/home/appuser/.homekit_pairings.json:ro
      - ${GMAIL_CREDENTIALS_FILE:-/dev/null}:/home/appuser/gmail_credentials.json:ro
      - ${GMAIL_TOKEN_FILE:-/dev/null}:/home/appuser/gmail_token.json:rw
      - ./config:/app/config:rw
      - ./data:/app/data:rw
    environment:
      - ENABLE_MCP=true
      - SONOS_SPEAKER_IPS=${SONOS_SPEAKER_IPS}
      - HOMECLAW_MCP_URL=http://host.docker.internal:9876
      - MEMORY_MCP_URL=http://memory:8765/mcp
      - CLAUDE_CODE_OAUTH_TOKEN=dummy-oauth-proxy-placeholder
      - ANTHROPIC_BASE_URL=http://auth-proxy:8080
      - SUPERUSER_IDS=${SUPERUSER_IDS}
      - GMAIL_CREDENTIALS_FILE=/home/appuser/gmail_credentials.json
      - GMAIL_TOKEN_FILE=/home/appuser/gmail_token.json
      - SCHEDULER_ENABLED=${SCHEDULER_ENABLED:-false}
      - SCHEDULER_TASKS_FILE=/app/config/tasks.yaml
      - SCHEDULER_STATE_FILE=/app/data/scheduler_state.json
      - SCHEDULER_TIMEZONE=${SCHEDULER_TIMEZONE:-US/Pacific}
      - FLIGHTS_ENABLED=${FLIGHTS_ENABLED:-false}
      - AMADEUS_CLIENT_ID=${AMADEUS_CLIENT_ID}
      - AMADEUS_CLIENT_SECRET=${AMADEUS_CLIENT_SECRET}
      - AMADEUS_HOSTNAME=${AMADEUS_HOSTNAME:-production}
      - WEBHOOK_ENABLED=${WEBHOOK_ENABLED:-false}
      - WEBHOOK_PORT=${WEBHOOK_PORT:-8081}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - PLAYWRIGHT_ENABLED=${PLAYWRIGHT_ENABLED:-false}
      - SEATS_AERO_API_KEY=${SEATS_AERO_API_KEY}
      - STOCKS_ENABLED=${STOCKS_ENABLED:-false}
      - BRAVE_API_KEY=${BRAVE_API_KEY}
      - GOOGLE_FLIGHTS_ENABLED=${GOOGLE_FLIGHTS_ENABLED:-false}
      - SERPAPI_API_KEY=${SERPAPI_API_KEY}
      - SHOPPING_LIST_ENABLED=${SHOPPING_LIST_ENABLED:-false}
      - AUTO_REPLY_CHANNEL_IDS=${AUTO_REPLY_CHANNEL_IDS}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
